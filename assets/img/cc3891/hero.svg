<text class="lbl" x="480" y="252" style="font-size:19px">Compute</text><text class="sub" x="480" y="272" style="font-size:13px">align, cluster, model</text>
<g transform="translate(645 152) scale(1.15)"><path d="M-48-6C-48-36-14-46 12-40C40-34 52-12 46 14C40 40 8 46-18 40C-44 34-48 14-48-6Z" fill="#fef3c7" stroke="#d97706" stroke-width="3" />
<g fill="#d97706"><circle cx="-26" cy="-12" r="6" /><circle cx="-8" cy="-22" r="6" /><circle cx="-22" cy="12" r="6" /><circle cx="-2" cy="22" r="6" /><circle cx="20" cy="-18" r="6" /></g>
<g fill="#e11d48"><circle class="pulse" cx="22" cy="8" r="7" /><circle class="pulse" cx="34" cy="22" r="6" style="animation-delay:.4s" /><circle class="pulse" cx="12" cy="24" r="5" style="animation-delay:.8s" /></g></g>
<text class="lbl" x="645" y="252" style="font-size:19px">Understand</text><text class="sub" x="645" y="272" style="font-size:13px">which cells go wrong</text>
<g transform="translate(808 152) scale(1.15)"><g transform="rotate(-35)"><rect x="-38" y="-14" width="76" height="28" rx="14" fill="#fff" stroke="#be123c" stroke-width="3" />
<path d="M0-14H24A14 14 0 0 1 24 14H0Z" fill="#fb7185" /><path d="M-38 0a14 14 0 0 1 14-14H0V14H-24A14 14 0 0 1-38 0Z" fill="#fff" />
<rect x="-38" y="-14" width="76" height="28" rx="14" fill="none" stroke="#be123c" stroke-width="3" /></g>
