<g fill="#f59e0b">
<circle class="glow" cx="50" cy="100" r="38" style="animation-delay:0.0s"/>
<circle class="glow" cx="150" cy="100" r="38" style="animation-delay:1.5s"/>
<circle class="glow" cx="250" cy="100" r="38" style="animation-delay:3.0s"/>
<circle class="glow" cx="50" cy="225" r="38" style="animation-delay:0.0s"/>
<circle class="glow" cx="150" cy="225" r="38" style="animation-delay:1.5s"/>
<circle class="glow" cx="250" cy="225" r="38" style="animation-delay:3.0s"/>
<circle class="glow" cx="480" cy="152" r="70" style="animation-delay:4.5s"/>
<circle class="glow" cx="645" cy="152" r="70" style="animation-delay:6.0s"/>
<circle class="glow" cx="808" cy="152" r="70" style="animation-delay:7.5s"/>
</g>
<g transform="translate(50 100) scale(.62)"><path d="M0-40C22-10 32 2 32 16A32 32 0 0 1-32 16C-32 2-22-10 0-40Z" fill="#e11d48" />
<path d="M-14 8C-16 18-12 26-4 28" fill="none" stroke="#fda4af" stroke-width="4" stroke-linecap="round" /></g>
