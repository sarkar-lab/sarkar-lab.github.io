<text class="lbl" x="150" y="277" style="font-size:11px">Stain &amp; section</text>
<g transform="translate(250 225) scale(.62)"><g transform="rotate(-25)"><rect x="-8" y="-42" width="16" height="46" rx="4" fill="#fff" stroke="#be185d" stroke-width="3"/><rect x="-5" y="-48" width="10" height="8" rx="2" fill="#be185d"/><rect x="-5" y="4" width="10" height="8" fill="#be185d"/></g><path d="M22 -8C40 6 38 28 16 36" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/><rect x="-16" y="18" width="34" height="5" rx="2" fill="#475569"/><rect x="-10" y="13" width="22" height="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/><rect x="-30" y="36" width="64" height="8" rx="3" fill="#475569"/></g>
<text class="lbl" x="250" y="277" style="font-size:11px">Image</text>
<g transform="translate(480 152) scale(1.15)"><rect x="-46" y="-36" width="92" height="60" rx="7" fill="#fff" stroke="#1d4ed8" stroke-width="3" />
<g fill="#6366f1"><circle cx="-28" cy="-18" r="4" /><circle cx="-18" cy="-8" r="4" /><circle cx="-31" cy="-4" r="4" /></g>
