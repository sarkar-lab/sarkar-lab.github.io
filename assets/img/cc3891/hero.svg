<g transform="translate(52 190)"><circle r="10" fill="#e11d48"/><text class="num" y="5">1</text></g>
<text class="lbl" x="52" y="214" style="font-size:13px">Sample</text><text class="sub" x="52" y="228" style="font-size:10px">blood or tissue</text>
<g transform="translate(158 190)"><circle r="10" fill="#0f766e"/><text class="num" y="5">2</text></g>
<text class="lbl" x="158" y="214" style="font-size:13px">Extract DNA</text><text class="sub" x="158" y="228" style="font-size:10px">in the lab</text>
<g transform="translate(264 190)"><circle r="10" fill="#7c3aed"/><text class="num" y="5">3</text></g>
<text class="lbl" x="264" y="214" style="font-size:13px">Sequence</text><text class="sub" x="264" y="228" style="font-size:10px">reads of A, C, G, T</text>
<g transform="translate(440 222)"><circle r="13" fill="#1d4ed8"/><text class="num" y="5">4</text></g>
<text class="lbl" x="440" y="252" style="font-size:19px">Compute</text><text class="sub" x="440" y="270" style="font-size:13px">align, cluster, model</text>
<g transform="translate(630 222)"><circle r="13" fill="#d97706"/><text class="num" y="5">5</text></g>
<text class="lbl" x="630" y="252" style="font-size:19px">Understand</text><text class="sub" x="630" y="270" style="font-size:13px">which cells go wrong</text>
<g transform="translate(810 222)"><circle r="13" fill="#be123c"/><text class="num" y="5">6</text></g>
<text class="lbl" x="810" y="252" style="font-size:19px">Intervene</text><text class="sub" x="810" y="270" style="font-size:13px">test drug ideas</text>
</svg>
