<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="A blood sample and a tissue biopsy are processed and sequenced, then merge into computation, understanding disease and drug response">
<style>
.lbl{font:700 15px system-ui,sans-serif;fill:#1f1f1f;text-anchor:middle}
.sub{font:12px system-ui,sans-serif;fill:#555;text-anchor:middle}
.num{font:800 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}
.path{fill:none;stroke:#c9b79c;stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round;animation:flow 1.2s linear infinite}
.glow{opacity:0;animation:glow 9s linear infinite}
.dna{fill:none;stroke-width:2.5;stroke-linecap:round}
.mono{font:700 10px ui-monospace,Menlo,monospace}
.scan{animation:scan 2s ease-in-out infinite alternate}
.pulse{animation:pulse 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes glow{0%,2%{opacity:0}6%,14%{opacity:.35}18%,100%{opacity:0}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(20px)}}
@keyframes pulse{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.path,.glow,.scan,.pulse{animation:none}.glow{opacity:.2}}
</style>

<rect width="900" height="340" rx="18" fill="#fff7e8"/>
<rect x="400" y="14" width="486" height="312" rx="14" fill="#fff" stroke="#e9dccb" stroke-width="2"/>
<text class="sub" x="643" y="38" style="font-weight:700;letter-spacing:.08em;fill:#92400e">THIS COURSE: THE COMPUTATION AND WHAT IT REVEALS</text>
<text class="sub" x="150" y="38" style="letter-spacing:.08em">IN THE LAB</text>
<path class="path" d="M50 100 H264"/>
<path class="path" d="M50 225 H264"/>
<path class="path" d="M264 100 C335 100 325 162 385 162"/><path class="path" d="M264 225 C335 225 325 162 385 162"/><path class="path" d="M385 162 H480"/>
