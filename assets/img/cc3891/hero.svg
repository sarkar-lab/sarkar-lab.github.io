<g class="mono" fill="#c4b5fd"><text x="-33" y="-9">ACGTTGCA</text><text x="-33" y="1" fill="#f0abfc">TTGACCGT</text></g>
<rect x="-38" y="-24" width="76" height="3" fill="#e879f9" class="scan" opacity=".8"/>
<rect x="-26" y="16" width="52" height="8" rx="4" fill="#ddd6fe"/>
<circle cx="36" cy="20" r="3" fill="#22c55e"/></g>
