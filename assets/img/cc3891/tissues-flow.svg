<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" role="img" aria-label="Tissues: coordinates, graph, neighborhoods, insight">
<style>
.b{fill:#fff;stroke:#b45309;stroke-width:2}
.t{font:700 13px system-ui,sans-serif;fill:#b45309;text-anchor:middle}
.u{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}
.h{fill:#b45309;opacity:0}
.a{stroke:#b45309;stroke-width:2.5;stroke-dasharray:5 5;fill:none;animation:f 1s linear infinite}
