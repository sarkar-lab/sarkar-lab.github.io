<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" role="img" aria-label="Models: features, train, predict, evaluate">
<style>
.b{fill:#fff;stroke:#1d4ed8;stroke-width:2}
.t{font:700 13px system-ui,sans-serif;fill:#1d4ed8;text-anchor:middle}
.u{font:11px system-ui,sans-serif;fill:#555;text-anchor:middle}
.h{fill:#1d4ed8;opacity:0}
.a{stroke:#1d4ed8;stroke-width:2.5;stroke-dasharray:5 5;fill:none;animation:f 1s linear infinite}
@keyframes f{to{stroke-dashoffset:-10}}
@keyframes p{0%,5%{opacity:.18}25%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.a,.h{animation:none}}
</style>
<rect width="520" height="110" rx="12" fill="#eff6ff"/>
<rect class="b" x="14" y="22" width="100" height="66" rx="10"/><rect class="h" x="14" y="22" width="100" height="66" rx="10" style="animation:p 6s linear infinite;animation-delay:0.0s"/><text class="t" x="64" y="52">Features</text><text class="u" x="64" y="70">from data</text><path class="a" d="M118 55 H137"/><rect class="b" x="141" y="22" width="100" height="66" rx="10"/><rect class="h" x="141" y="22" width="100" height="66" rx="10" style="animation:p 6s linear infinite;animation-delay:1.5s"/><text class="t" x="191" y="52">Train</text><text class="u" x="191" y="70">learn patterns</text><path class="a" d="M245 55 H264"/><rect class="b" x="268" y="22" width="100" height="66" rx="10"/><rect class="h" x="268" y="22" width="100" height="66" rx="10" style="animation:p 6s linear infinite;animation-delay:3.0s"/><text class="t" x="318" y="52">Predict</text><text class="u" x="318" y="70">new samples</text><path class="a" d="M372 55 H391"/><rect class="b" x="395" y="22" width="100" height="66" rx="10"/><rect class="h" x="395" y="22" width="100" height="66" rx="10" style="animation:p 6s linear infinite;animation-delay:4.5s"/><text class="t" x="445" y="52">Evaluate</text><text class="u" x="445" y="70">does it hold?</text></svg>
